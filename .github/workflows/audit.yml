name: Audit

on:
  push:
    branches: [main]
    paths:
      - rust/Cargo.lock
      - rust/Cargo.toml
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - rust/Cargo.lock
      - rust/Cargo.toml
      - .github/workflows/audit.yml
  # Advisories are published against code that hasn't changed, so a lockfile
  # nobody touches would never trigger the run that finds them.
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: rust advisories
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-audit

      # Fails on vulnerabilities. Unmaintained and unsound notices are reported
      # but don't fail the run; several come from dev-only codegen crates.
      - name: Audit
        run: cargo audit
