name: Flutter

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OBJECTBOX_VERSION: 5.3.2
  # sha256 of objectbox-linux-x64.tar.gz for OBJECTBOX_VERSION. Bump the two
  # together; GitHub shows the digest on the release asset.
  OBJECTBOX_SHA256: 6dbb5450c36dd11ee9074f16ecc61e79b45ff43c2082934601f3166b39c8a613

jobs:
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      # `.env` is declared as an asset, so the bundle can't build without one.
      # Tests never read it; the placeholder values are enough.
      - name: Provide placeholder .env
        run: cp .env.example .env

      # The persistence tests open a real store and skip without this library.
      # See test/helpers/object_box_test_store.dart.
      - name: Install ObjectBox native library
        run: |
          mkdir -p "$RUNNER_TEMP/objectbox"
          curl -sSfL -o "$RUNNER_TEMP/objectbox.tar.gz" \
            "https://github.com/objectbox/objectbox-c/releases/download/v${OBJECTBOX_VERSION}/objectbox-linux-x64.tar.gz"
          echo "${OBJECTBOX_SHA256}  $RUNNER_TEMP/objectbox.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/objectbox.tar.gz" -C "$RUNNER_TEMP/objectbox"
          cp "$RUNNER_TEMP/objectbox/lib/libobjectbox.so" lib/

      - name: Install dependencies
        run: flutter pub get

      # Generated files come out of codegen already formatted, and the Bindings
      # workflow fails if they drift, so they need no exclusion here.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
