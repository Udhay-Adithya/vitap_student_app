name: vit_ap_student_app
description: "VITAP Student"
publish_to: "none"
version: 2.5.2+31

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  animations: ^2.0.11
  app_settings: ^7.0.0
  cached_network_image: ^3.4.1
  carousel_slider: ^5.0.0
  crypto: ^3.0.8
  cupertino_icons: ^1.0.6
  device_info_plus: ^13.3.0
  file_picker: ^12.0.0-beta.7
  firebase_analytics: ^11.4.6
  firebase_core: ^3.13.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  flutter_file_dialog: ^3.3.6
  flutter_local_notifications: ^22.0.1
  flutter_m3shapes_extended: ^1.2.0
  flutter_markdown: ^0.7.7+1
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^3.5.0
  flutter_rust_bridge: 2.12.0
  flutter_secure_storage: ^10.3.1
  fpdart: ^1.1.1
  freezed_annotation: ^3.1.0
  google_fonts: ^8.2.0
  home_widget: ^0.10.0
  html: ^0.15.7
  http: ^1.2.1
  iconsax_flutter: ^1.0.0
  in_app_review: ^2.0.12
  intl: ^0.20.3
  json_annotation: ^4.12.0
  lib_vtop:
    path: rust_builder
  lottie: ^3.8.2
  meta: 1.19.0
  objectbox: ^6.0.0-preview.6
  objectbox_flutter_libs: ^6.0.0-preview.6
  open_file: ^4.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  pinput: ^6.0.2
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  syncfusion_flutter_pdfviewer: ^34.1.31
  timeago: ^3.7.0
  timeline_tile: ^2.0.0
  timezone: ^0.11.2
  upgrader: ^13.5.0
  url_launcher: ^6.3.3
  wave: ^0.2.2
  webview_flutter: ^4.13.0
  wiredash: ^2.6.1

dev_dependencies:
  build_runner: ^2.11.1
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.13.2
  objectbox_generator: ^6.0.0-preview.6
  riverpod_generator: ^4.0.10

dependency_overrides:
  test_api: 0.7.10

flutter:
  uses-material-design: true
  assets:
    - .env
    - LICENSE
    - NOTICE
    - rust/LICENSE
    - rust/NOTICE
    - assets/fonts/OFL.txt
    - assets/licenses/
    - assets/
    - assets/lottie/
    - assets/images/
    - assets/images/onboarding/
    - assets/images/pfp/
    - assets/images/logo/
    - assets/images/icons/
    - assets/weather_icons/
    - assets/demo/

  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
